version: "3.8"

services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-22.04
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - DATABASE_URL_ANONIMO=postgresql://devuser:devpass@db:5432/anonimo_db
      - DATABASE_URL_AUTH=postgresql://devuser:devpass@db:5432/auth_db
      - DATABASE_URL_MEMORIA=postgresql://devuser:devpass@db:5432/memoria_db
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"

volumes:
  postgres-data:
